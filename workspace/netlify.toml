# ── Netlify deploy config for Turf Clash ────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 6 requires Node 20.12+ (uses crypto.hash) — pin it so Netlify's
  # default (older) build image doesn't fail the build.
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# SPA fallback — any unknown path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed assets are immutable — cache them aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
